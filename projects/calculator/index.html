<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator | Faizan Hassan</title>
    <meta name="description" content="A modern, responsive calculator built with HTML, CSS, and JavaScript by Faizan Hassan" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../../assets/profile-pic.ico" />

    <!-- The portfolio's saved theme before first paint, and the theme button -->
    <script src="../project-page.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- The portfolio's design system, the shared demo page frame, then the calculator's own styles -->
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../project-page.css" />
    <link rel="stylesheet" href="style.css" />

    <!-- The portfolio's Contour Embers background -->
    <script src="../../js/background.js" defer></script>
  </head>
  <body>
    <canvas class="contour-bg" aria-hidden="true"></canvas>

    <!-- Navigation Header -->
    <header class="nav scrolled project-nav">
      <a href="../../index.html#projects" class="btn btn-sm btn-ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Back<span class="wide-only"> to Portfolio</span></span>
      </a>

      <a href="https://github.com/Thefaizanhassan" target="_blank" rel="noopener" class="btn btn-sm btn-solid">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        <span><span class="wide-only">View on </span>GitHub</span><span class="sr-only"> (opens in a new tab)</span>
      </a>
    </header>

    <main>
      <section class="block project-page">
        <div class="container project-layout">
          <!-- Project Header -->
          <header class="sec-head">
            <p class="eyebrow">Project Demo</p>
            <h1 class="sec-title">Calculator</h1>
            <p class="project-by">by Faizan Hassan</p>
          </header>

          <!-- Calculator -->
          <div class="glass calculator">
            <input type="text" id="inputBox" placeholder="0" readonly aria-label="Calculator display" />

            <div>
              <button class="button operator">AC</button>
              <button class="button operator">DEL</button>
              <button class="button operator">%</button>
              <button class="button operator">/</button>
            </div>
            <div>
              <button class="button">7</button>
              <button class="button">8</button>
              <button class="button">9</button>
              <button class="button operator">*</button>
            </div>
            <div>
              <button class="button">4</button>
              <button class="button">5</button>
              <button class="button">6</button>
              <button class="button operator">-</button>
            </div>
            <div>
              <button class="button">1</button>
              <button class="button">2</button>
              <button class="button">3</button>
              <button class="button operator">+</button>
            </div>
            <div>
              <button class="button">00</button>
              <button class="button">0</button>
              <button class="button">.</button>
              <button class="button equalBtn">=</button>
            </div>
          </div>

          <!-- Project Info -->
          <div class="project-info">
            <p>Built with HTML, CSS &amp; JavaScript</p>
            <div class="chips">
              <span class="chip">HTML5</span>
              <span class="chip">CSS3</span>
              <span class="chip">JavaScript</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <div class="glass foot">
          <p>Copyright &#169; <span id="year">2026</span> Faizan Hassan. All Rights Reserved.</p>
        </div>
      </div>
    </footer>

    <!-- Dark Mode Toggle Button -->
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
      <span class="theme-icon" aria-hidden="true">🌙</span>
    </button>

    <script src="script.js"></script>
  </body>
</html>
